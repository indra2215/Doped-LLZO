name: doped-llzo
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13.2
  - pip
  - numpy>=2.2.6
  - pandas>=2.2.3
  - scikit-learn>=1.8.0
  - joblib>=1.5.2
  - tqdm>=4.67.1
  - pip:
    - pymatgen>=2024.11.13
    - ase>=3.22.1
    - chgnet>=0.3.8
    # CPU-only torch (default). For GPU:
    # pip install torch==2.9.1+cu121 --index-url https://download.pytorch.org/whl/cu121
    - torch>=2.9.1

# Create environment:   conda env create -f environment.yml
# Activate:             conda activate doped-llzo
# Update existing:      conda env update -f environment.yml --prune
